name: Package & Publish VNC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew --no-daemon clean build

      - name: Get version from Gradle
        id: version
        run: |
          VERSION=$(./gradlew -q properties | awk -F': ' '/^version:/ {print $2; exit}')
          if [ -z "$VERSION" ]; then
            echo "Could not determine project version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout Maven repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: CroaBeast/repo
          path: maven-repo
          token: ${{ secrets.MAVEN_DEPLOY_TOKEN }}

      - name: Deploy modules to Maven repository
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          write_metadata () {
            GROUP_ID="$1"
            GROUP_PATH="$2"
            ARTIFACT_ID="$3"
            META_DIR="maven-repo/$GROUP_PATH/$ARTIFACT_ID"

            mkdir -p "$META_DIR"

            cat > "$META_DIR/maven-metadata.xml" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <metadata>
            <groupId>$GROUP_ID</groupId>
            <artifactId>$ARTIFACT_ID</artifactId>
            <versioning>
              <latest>$VERSION</latest>
              <release>$VERSION</release>
              <versions>
                <version>$VERSION</version>
              </versions>
              <lastUpdated>$(date -u +%Y%m%d%H%M%S)</lastUpdated>
            </versioning>
          </metadata>
          EOF
          }

          deploy_jar_artifact () {
            GROUP_ID="$1"
            GROUP_PATH="$2"
            ARTIFACT_ID="$3"
            SRC_DIR="$4"
            shift 4

            DEST_DIR="maven-repo/$GROUP_PATH/$ARTIFACT_ID/$VERSION"
            ART="$ARTIFACT_ID-$VERSION"

            mkdir -p "$DEST_DIR"

            MAIN_JAR="$SRC_DIR/$ART.jar"
            SRC_JAR="$SRC_DIR/$ART-sources.jar"
            DOC_JAR="$SRC_DIR/$ART-javadoc.jar"

            [ -f "$MAIN_JAR" ] && cp "$MAIN_JAR" "$DEST_DIR/$ART.jar"
            [ -f "$SRC_JAR" ] && cp "$SRC_JAR" "$DEST_DIR/$ART-sources.jar"
            [ -f "$DOC_JAR" ] && cp "$DOC_JAR" "$DEST_DIR/$ART-javadoc.jar"

            cat > "$DEST_DIR/$ART.pom" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>$GROUP_ID</groupId>
            <artifactId>$ARTIFACT_ID</artifactId>
            <version>$VERSION</version>
            <packaging>jar</packaging>
          EOF

            if [ "$#" -gt 0 ]; then
              cat >> "$DEST_DIR/$ART.pom" << EOF
            <dependencies>
          EOF

              for DEP in "$@"; do
                cat >> "$DEST_DIR/$ART.pom" << EOF
              <dependency>
                <groupId>$GROUP_ID</groupId>
                <artifactId>$DEP</artifactId>
                <version>$VERSION</version>
              </dependency>
          EOF
              done

              cat >> "$DEST_DIR/$ART.pom" << EOF
            </dependencies>
          EOF
            fi

            cat >> "$DEST_DIR/$ART.pom" << EOF
          </project>
          EOF

            write_metadata "$GROUP_ID" "$GROUP_PATH" "$ARTIFACT_ID"
          }

          deploy_bootstrap () {
            GROUP_ID="me.croabeast.vnc"
            GROUP_PATH="me/croabeast/vnc"
            ARTIFACT_ID="VNC"
            SRC_DIR="bootstrap/build/libs"
            DEST_DIR="maven-repo/$GROUP_PATH/$ARTIFACT_ID/$VERSION"
            ART="$ARTIFACT_ID-$VERSION"

            mkdir -p "$DEST_DIR"

            cp "$SRC_DIR/VNC-$VERSION.jar" "$DEST_DIR/$ART.jar"
            cp "$SRC_DIR/VNC-$VERSION-sources.jar" "$DEST_DIR/$ART-sources.jar"
            cp "$SRC_DIR/VNC-$VERSION-javadoc.jar" "$DEST_DIR/$ART-javadoc.jar"

            cat > "$DEST_DIR/$ART.pom" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>$GROUP_ID</groupId>
            <artifactId>$ARTIFACT_ID</artifactId>
            <version>$VERSION</version>
            <packaging>jar</packaging>
          </project>
          EOF

            write_metadata "$GROUP_ID" "$GROUP_PATH" "$ARTIFACT_ID"
          }

          GROUP_ID="me.croabeast.vnc"
          GROUP_PATH="me/croabeast/vnc"

          deploy_bootstrap
          deploy_jar_artifact "$GROUP_ID" "$GROUP_PATH" core       core/build/libs
          deploy_jar_artifact "$GROUP_ID" "$GROUP_PATH" bukkit     bukkit/build/libs core
          deploy_jar_artifact "$GROUP_ID" "$GROUP_PATH" fabric     mod/fabric/build/libs core
          deploy_jar_artifact "$GROUP_ID" "$GROUP_PATH" quilt      mod/quilt/build/libs core
          deploy_jar_artifact "$GROUP_ID" "$GROUP_PATH" forge      mod/forge/build/libs core
          deploy_jar_artifact "$GROUP_ID" "$GROUP_PATH" neoforge   mod/neoforge/build/libs core
          deploy_jar_artifact "$GROUP_ID" "$GROUP_PATH" sponge     mod/sponge/build/libs core
          deploy_jar_artifact "$GROUP_ID" "$GROUP_PATH" liteloader mod/liteloader/build/libs core
          deploy_jar_artifact "$GROUP_ID" "$GROUP_PATH" bungee     proxy/bungee/build/libs core
          deploy_jar_artifact "$GROUP_ID" "$GROUP_PATH" velocity   proxy/velocity/build/libs core

      - name: Commit Maven repository changes
        if: github.event_name != 'pull_request'
        run: |
          cd maven-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "Deploy VNC $VERSION" || echo "No changes to commit"
          git push
